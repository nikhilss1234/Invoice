<style>

<script>
const PDFW = { r: ' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~', rw: [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584],
  bw: [278, 333, 474, 556, 556, 889, 722, 238, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 333, 333, 584, 584, 584, 611, 975, 722, 722, 722, 722, 667, 611, 778, 722, 278, 556, 722, 611, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 333, 278, 333, 584, 556, 333, 556, 611, 556, 611, 556, 333, 611, 611, 278, 278, 556, 278, 889, 611, 611, 611, 611, 389, 556, 333, 611, 556, 778, 556, 556, 500, 389, 280, 389, 584] };
const PDF_MAP = { '–': '\x96', '—': '\x97', '‘': '\x91', '’': '\x92', '“': '\x93', '”': '\x94', '•': '\x95', '·': '\xB7', '→': '->', '✔': '', '✓': '', 'Σ': 'Total', '…': '...', ' ': ' ' };

  if (cur) out.push(cur);

  return out.length ? out : [''];
}
function PdfDoc(footer) {
  const W = 595.28, H = 841.89, M = 40, pages = []; let cur = null, y = 0;
  const esc2 = t => pdfEnc(t).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const col = c => c.map(v => (v / 255).toFixed(3)).join(' ');
  const d = {
    W, H, M, get y() { return y; }, set y(v) { y = v; },
    page() { cur = []; pages.push(cur); y = M; },
    need(h) { if (y + h > H - M - 18) d.page(); },
    text(s, x, top, o) { o = o || {}; const size = o.size || 9, bold = !!o.bold; let xx = x; if (o.align === 'r') xx = x - pdfWidth(s, size, bold); else if (o.align === 'c') xx = x - pdfWidth(s, size, bold) / 2; cur.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + col(o.color || [30, 30, 30]) + ' rg ' + xx.toFixed(2) + ' ' + (H - top - size * 0.8).toFixed(2) + ' Td (' + esc2(s) + ') Tj ET'); },
    rect(x, top, w, h, fill, stroke) { cur.push((fill ? col(fill) + ' rg ' : '') + (stroke ? col(stroke) + ' RG 0.6 w ' : '') + x.toFixed(2) + ' ' + (H - top - h).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re ' + (fill && stroke ? 'B' : fill ? 'f' : 'S')); },
    line(x1, t1, x2, t2, c, w) { cur.push(col(c || [200, 200, 200]) + ' RG ' + (w || 0.5) + ' w ' + x1.toFixed(2) + ' ' + (H - t1).toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + (H - t2).toFixed(2) + ' l S'); },
    build() {
      const objs = []; const add = s => { objs.push(s); return objs.length; };
      add('<< /Type /Catalog /Pages 2 0 R >>'); add(''); add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'); add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids = [];
      pages.forEach((p, i) => {
        p.push('BT /F1 7.5 Tf 0.5 0.5 0.5 rg ' + M + ' 22 Td (' + esc2(footer) + ') Tj ET');
        if (pages.length > 1) p.push('BT /F1 7.5 Tf 0.5 0.5 0.5 rg ' + (W - M - 40).toFixed(2) + ' 22 Td (' + esc2('Page ' + (i + 1) + ' of ' + pages.length) + ') Tj ET');
        const st = p.join('\n'), cid = add('<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream');

      return Uint8Array.from(out, ch => ch.charCodeAt(0) & 255);
    }
  };
  d.page(); return d;
}

/* ===== Invoices - a small app to raise tax invoices and keep one Google Sheet register ===== */
const APP_VERSION = '1.0 · 21 Oct 2026';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const N = v => { const x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => ymd(new Date());
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const dshow = s => s ? (+s.slice(8, 10)) + ' ' + MON[+s.slice(5, 7) - 1] + ' ' + s.slice(0, 4) : '';
/* Indian grouping: 3,20,300.00 */
function inr(n) {
  n = r2(n); const neg = n < 0; let s = Math.abs(n).toFixed(2); let [i, f] = s.split('.');
  if (i.length > 3) { const last3 = i.slice(-3); let rest = i.slice(0, -3); rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ','); i = rest + ',' + last3; }
  return (neg ? '-' : '') + i + '.' + f;
}
/* amount in words, Indian system */
function wordsINR(n) {
  n = Math.round(Math.abs(n)); if (n === 0) return 'Rupees Zero Only';
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : '');
  const three = x => (x >= 100 ? ones[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' and ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const parts = [];
  const cr = Math.floor(n / 10000000); n %= 10000000;
  const lk = Math.floor(n / 100000); n %= 100000;
  const th = Math.floor(n / 1000); n %= 1000;
  if (cr) parts.push(three(cr) + ' Crore'); if (lk) parts.push(two(lk) + ' Lakh'); if (th) parts.push(two(th) + ' Thousand'); if (n) parts.push(three(n));
  return 'Rupees ' + parts.join(' ') + ' Only';
}

/* ---------- state ---------- */
const SEED_SET = { prefix: 'DEV', name: 'Sasidharan Nair R', firm: 'Devi Electrical Works', addr: ['PWD, Thiruvananthapuram'], gstin: '32AELPP9121L1Z7', cgst: 9, sgst: 9, scope: 'Electrical Work', bldg: 'Government Building', unit: 'Job', digits: 3, base: { '2026': 9 } };
const SEED_CUST = [
  { name: 'Office of the Assistant Executive Engineer', lines: ['PWD Electrical Sub Division', 'KLC, Thiruvananthapuram'], gstin: '32AAAG00782J1DM' },
  { name: 'The Executive Engineer', lines: ['Electrical Division', 'PWD, Thiruvananthapuram'], gstin: '32TVDP01198B1DB' }
];
function seedInv(no, date, cust, loc, desc, rate) {
  const c = calcFor(rate, SEED_SET); return { id: 'seed' + no.slice(-3), no, date, cust: cust.name, custLines: cust.lines, custGstin: cust.gstin, scope: 'Electrical Work', bldg: 'Government Building', loc, desc, unit: 'Job', qty: 1, rate: c.taxable, cgst: c.cgst, sgst: c.sgst, ro: c.ro, total: c.total, status: 'Approved', created: '' };
}
let S = null, UI = { view: 'list', year: '', q: '', id: null, confirm: null, scan: '', busy: false }, F = null, OB = [], SY = { url: '', token: '', last: 0, err: '' }, syncing = false;
function load() {
  try { const j = JSON.parse(localStorage.getItem('inv.v1') || 'null'); if (j && j.set) S = j; } catch (e) { }
  if (!S) S = { set: SEED_SET, customers: SEED_CUST, invoices: [seedInv('DEV/2026/008', '2026-09-14', SEED_CUST[0], 'District Court, Thiruvanathapuram', 'GENERAL- District court complex and Advocate general office at Vanchiyoor, Thiruvananthapuram- Running maintenance contract of electrical installations for financial year 2025-26-CMC-Electrical- District court complex and Advocate general office-General Electrical Work', 70089), seedInv('DEV/2026/009', '2026-10-07', SEED_CUST[1], 'Ayurveda College, Thiruvanathapuram', 'DEPOSIT- Replacement & maintenance work- Govt Ayurveda panchakarma hospital Poojapppura TVPM- Replacement of damaged sewage plant UG cable,providing power supply for Incinerator, Replacement & maintenance existing electrical installation in new block and providing calling bell for main gate at Govt.Ayurveda Panchakarma hospital, Poojappura, TVPM- General Electrical Work', 320300)], draft: null };
  try { const y = JSON.parse(localStorage.getItem('inv.sy') || 'null'); if (y) SY = Object.assign(SY, y); } catch (e) { }

}
const persist = () => { try { S.draft = F; localStorage.setItem('inv.v1', JSON.stringify(S)); } catch (e) { } };

const syncOn = () => !!(SY.url && SY.token);

/* ---------- money, numbers ---------- */
function calcFor(rate, set) {
  const t = r2(N(rate)), c = r2(t * N(set.cgst) / 100), s = r2(t * N(set.sgst) / 100), sum = r2(t + c + s), total = Math.round(sum);
  return { taxable: t, cgst: c, sgst: s, ro: r2(total - sum), total };
}
const calc = rate => calcFor(rate, S.set);
function numOf(no) { const m = /\/(\d{4})\/(\d+)$/.exec(String(no || '')); return m ? { y: m[1], n: +m[2] } : null; }
function nextNo(year, exceptId) {
  const set = S.set; let mx = N((set.base || {})[year]);
  S.invoices.forEach(i => { if (i.id === exceptId) return; const k = numOf(i.no); if (k && k.y === String(year) && k.n > mx) mx = k.n; });
  return set.prefix + '/' + year + '/' + String(mx + 1).padStart(N(set.digits) || 3, '0');
}
const yearsList = () => { const y = {}; S.invoices.forEach(i => { if (i.date) y[i.date.slice(0, 4)] = 1; }); y[today().slice(0, 4)] = 1; return Object.keys(y).sort().reverse(); };
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shortCust = c => String(c || '').replace(/^(office of the |the )/i, '');

/* ---------- toast ---------- */
let toastT = null;
function toast(t) { const el = $('#toast'); if (!el) return; el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }

/* ---------- sync with the Google Sheet ---------- */
function qOp(op) { if (!syncOn()) return; OB = OB.filter(x => !(x.op === op.op && x.id === op.id)); OB.push(op); saveOB(); clearTimeout(qOp.t); qOp.t = setTimeout(() => syncNow(false), 300); renderStatus(); }
function applyOb(st) { OB.forEach(op => { if (op.op === 'upsertInvoice') { const i = st.invoices.findIndex(x => x.id === op.id); if (i >= 0) st.invoices[i] = op.data; else st.invoices.push(op.data); } }); }

  doc.text('Location', M + 7, y + 2 * rh + 6.5, { size: 9.5, color: GR }); doc.text(pdfWrap(inv.loc, W - 90, 9.5, false, 1)[0], M + cw[0] + 7, y + 2 * rh + 6.5, { size: 9.5 });
  [1, 2].forEach(i => doc.line(M, y + i * rh, M + W, y + i * rh, LN, 0.5));
  doc.line(M + cw[0], y, M + cw[0], y + 3 * rh, LN, 0.5); doc.line(M + cw[0] + cw[1], y, M + cw[0] + cw[1], y + 2 * rh, LN, 0.5); doc.line(M + cw[0] + cw[1] + cw[2], y, M + cw[0] + cw[1] + cw[2], y + 2 * rh, LN, 0.5);
  y += rh * 3 + 12;
  /* items */
  const cols = [40, 0, 42, 36, 74, 82]; cols[1] = W - cols.reduce((a, b) => a + b, 0);
  const xs = [M]; cols.forEach((c, i) => xs.push(xs[i] + c));
  doc.rect(M, y, W, 22, BG, LN);
  ['SL NO', 'DESCRIPTION OF WORK', 'UNIT', 'QTY', 'RATE', 'AMOUNT'].forEach((t, i) => doc.text(t, i >= 4 ? xs[i + 1] - 6 : xs[i] + 6, y + 6.5, { size: 8.5, bold: true, align: i >= 4 ? 'r' : 'l' }));
  y += 22;
  const dl = pdfWrap(inv.desc, cols[1] - 14, 9.5, false), dh = Math.max(46, dl.length * 12.5 + 14);
  doc.need(dh + 200);
  doc.rect(M, y, W, dh, null, LN); for (let i = 1; i < 6; i++) doc.line(xs[i], y - 22, xs[i], y + dh, LN, 0.5);
  doc.text('1', xs[0] + 8, y + 7, { size: 9.5 }); dl.forEach((t, i) => doc.text(t, xs[1] + 7, y + 7 + i * 12.5, { size: 9.5 }));
  doc.text(inv.unit, xs[2] + 6, y + 7, { size: 9.5 }); doc.text(String(inv.qty), xs[3] + 6, y + 7, { size: 9.5 });
  doc.text(inr(inv.rate), xs[5] - 6, y + 7, { size: 9.5, align: 'r' }); doc.text(inr(inv.rate * inv.qty), xs[6] - 6, y + 7, { size: 9.5, align: 'r' });
  y += dh + 14;
  /* totals */
  const tw = 270, tx = M + W - tw, rows = [['TOTAL AMOUNT (Excluding GST)', inr(inv.rate * inv.qty)], ['CGST @' + s.cgst + '%', inr(inv.cgst)], ['SGST @' + s.sgst + '%', inr(inv.sgst)], ['ROUND OFF', inr(inv.ro)], ['TOTAL AMOUNT (Including GST)', inr(inv.total)]];
  rows.forEach((r, i) => { const last = i === rows.length - 1; doc.rect(tx, y + i * 21, tw, 21, last ? BG : null, LN); doc.text(r[0], tx + 8, y + i * 21 + 6, { size: 9.5, bold: last }); doc.text(r[1], tx + tw - 8, y + i * 21 + 6, { size: 9.5, bold: last, align: 'r' }); });
  y += rows.length * 21 + 14;
  doc.text('Amount in words', M, y, { size: 8, bold: true, color: GR }); y += 12;
  pdfWrap(wordsINR(inv.total), W, 10, true).forEach(t => { doc.text(t, M, y, { size: 10, bold: true }); y += 13; });
  y += 18; doc.need(110);
  doc.text('For ' + s.firm, M + W, y, { size: 10, bold: true, align: 'r' }); y += 62;
  doc.line(M + W - 170, y, M + W, y, LN, 0.6); y += 5;
  doc.text('Authorised Signatory', M + W, y, { size: 9.5, bold: true, align: 'r' }); y += 14;
  doc.text(s.name, M + W, y, { size: 9.5, align: 'r' });
  return doc.build();
}
const invPdfName = inv => 'Invoice-' + String(inv.no).replace(/[^A-Za-z0-9]+/g, '-') + '.pdf';
function invPdf(inv, share) {
  let bytes; try { bytes = invPdfBytes(inv); } catch (e) { toast('Could not make the PDF: ' + e.message); return; }
  const name = invPdfName(inv), blob = new Blob([bytes], { type: 'application/pdf' });
  if (share) {
    if (navigator.canShare) { try { const f = new File([blob], name, { type: 'application/pdf' }); if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Invoice ' + inv.no }).catch(() => { }); return; } } catch (e) { } }
    toast('Sharing is not available here, so the PDF is being downloaded instead.');
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('PDF saved: ' + name); } catch (e) { window.open(URL.createObjectURL(blob)); }
}

/* ---------- events ---------- */
function setBind(key, el) {
  const [ns, k] = key.split(':'); const v = el.value;
  if (key === 'q') { UI.q = v; const l = $('#invList'); if (l) { const q = v.trim().toLowerCase(), qa = q.replace(/[,\s]/g, ''), amt = /^[0-9]+(\.[0-9]+)?$/.test(qa) ? Number(qa) : null; let list = S.invoices.filter(i => UI.year === 'all' || (i.date || '').slice(0, 4) === UI.year).sort((a, b) => (b.no || '').localeCompare(a.no || '')); if (q) list = list.filter(i => (i.no + ' ' + i.cust + ' ' + i.loc + ' ' + i.desc).toLowerCase().indexOf(q) >= 0 || (amt !== null && (Math.abs(i.total - amt) < 0.005 || Math.abs(i.rate - amt) < 0.005))); l.innerHTML = listHtml(list); } return; }
  if (ns === 'f' && F) {
    F[k] = v; persist();
    if (k === 'rate') { const b = $('#calcBox'); if (b) b.innerHTML = calcHtml(calc(F.rate)); }
    if (k === 'cust' || k === 'date') render();
  }
}
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.bind && el.tagName !== 'SELECT' && el.type !== 'date') setBind(el.dataset.bind, el); });
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset) return;
  if (el.dataset.scan) { const f = el.files && el.files[0]; if (f) scanDesc(f); el.value = ''; return; }
  if (el.dataset.bind) setBind(el.dataset.bind, el);
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  switch (act) {
    case 'tab': if (arg === 'new') { if (!F) F = newForm(); persist(); go('form'); } else if (arg === 'settings') go('settings'); else go('list'); break;
    case 'list': go('list'); break;
    case 'year': UI.year = arg; render(); break;
    case 'resume': go('form'); break;
    case 'open': go('view', { id: arg }); break;
    case 'moreTog': F.more = !F.more; render(); break;
    case 'clrDesc': F.desc = ''; UI.scan = ''; persist(); render(); break;
    case 'preview': { const p = formProblems(); if (p.length) { toast(p[0]); break; } persist(); go('preview'); break; }
    case 'edit': go('form'); break;
    case 'discard': F = null; persist(); UI.scan = ''; go('list'); break;
    case 'approve': {
      const p = formProblems(); if (p.length) { toast(p[0]); break; }
      const inv = invFromForm(); inv.status = 'Approved';
      const i = S.invoices.findIndex(x => x.id === inv.id); if (i >= 0) S.invoices[i] = inv; else S.invoices.push(inv);
      qOp({ op: 'upsertInvoice', id: inv.id, data: inv });
      F = null; UI.scan = ''; persist(); go('view', { id: inv.id }); toast('Approved as ' + inv.no); break;
    }
    case 'editInv': { const inv = S.invoices.find(i => i.id === UI.id); if (!inv) break; F = newForm({ id: inv.id, cust: inv.cust, date: inv.date, loc: inv.loc, desc: inv.desc, rate: String(inv.rate), scope: inv.scope, bldg: inv.bldg, unit: inv.unit }); persist(); go('form'); break; }
    case 'askCx': UI.confirm = 'cx'; render(); break;
    case 'cancelInv': { const inv = S.invoices.find(i => i.id === UI.id); if (!inv) break; inv.status = 'Cancelled'; qOp({ op: 'upsertInvoice', id: inv.id, data: inv }); persist(); UI.confirm = null; render(); toast(inv.no + ' cancelled'); break; }
    case 'pdf': { const inv = S.invoices.find(i => i.id === UI.id); if (inv) invPdf(inv, arg === 'share'); break; }
    case 'conn': {
      const url = ($('#sy_url').value || '').trim(), tok = ($('#sy_tok').value || '').trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url) || !tok) { toast('Paste the web app URL (ending /exec) and your secret'); break; }
      SY = { url, token: tok, last: 0, err: '' }; saveSY(); toast('Connecting…');
      callSheet([]).then(j => { adopt(j.state); SY.last = Date.now(); saveSY(); persist(); toast('Connected. ' + S.invoices.length + ' invoices loaded.'); render(); }).catch(e => { SY = { url: '', token: '', last: 0, err: '' }; saveSY(); toast(e.server ? e.message : 'Could not connect. Check the URL and that the deployment allows Anyone.'); render(); });
      break;
    }
    case 'syncNow': syncNow(true); break;
    case 'disc': SY = { url: '', token: '', last: 0, err: '' }; OB = []; saveSY(); saveOB(); toast('Disconnected. Invoices stay on this phone.'); render(); break;
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });

/* ---------- start ---------- */
function start() {
  load();
  document.querySelectorAll('.tabbar button').forEach(b => { b.dataset.act = 'tab'; });
  render();
  try {
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(r => { try { r.update(); } catch (e) { } }).catch(() => { });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !window.__swReloaded && UI.view !== 'form') { window.__swReloaded = true; location.reload(); } });
    }
  } catch (e) { }
  window.addEventListener('online', () => syncNow(false));
  setInterval(() => { renderStatus(); }, 60000);
  if (syncOn()) syncNow(false);
}
start();
